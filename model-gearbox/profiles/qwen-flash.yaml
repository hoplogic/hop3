  m_9pts_bare: { pass: '6/6', n: 6 }
  l_18pts_bare: { pass: '6/6', n: 6 }
  xl_40pts_bare: { pass: '2/6', n: 6 }    # 坍塌起点
  xxl_80pts_bare: { pass: '0/6', n: 6 }   # 每发约 18KB,未截断——真漏点与类型标错
  # 思考开档同一探针(2026-09-28,--thinking on):通过率与每发覆盖数。M/L 两档失分全是把"孕妇心脏病患者放心"并进"对所有人安全",见 dims.task_complexity
  thinking_on_bare: { xs: '6/6', s: '6/6', m: '0/6 (每发 8/9)', l: '0/6 (每发 15-16/18)', xl: '0/6 (每发 38-39/40)', xxl: '3/6 (每发 76-80/80)', n: 6 }

adapt:
  max_inline_tools: null           # 不收窄(agent 判定):act_free 的失手与工具数无关,收窄工具面治不了"不读就编"
  thinking: endpoint-default       # 端点缺省关,发 thinking enabled 能打开(端点票实测)。开关两档都量全了(2026-09-28),开思考按步骤类型分:
    # 该开——把关步(L3 单点从 6/12 恢复到 12/12,L1 升到 open-ok)、SQL 复杂取数(一次写对 2/6→6/6)、结构化交付含多行文本的对象(T2 2/6→5/6);
    # 不开——提取步(18 点以内开思考反而并点漏点,M/L 从 6/6 掉到 0/6)、重推理步(乘法开 6 关 7,除法开 3 关 5)、
    #   Python 脚本步(沙箱写法习惯开思考不改)。开思考单发慢且贵,只给上面"该开"的几类步骤开
  build_target_profile: null       # 没做构建卷
  step_notes: 按现有数据的派活口径——提取类步骤每发控制在 18 个要点以内;把关步用清单式判据,不拆成只回 yes/no 的单点小题(L3 反常);
    Python 校验脚本步不派;SQL 简单/普通档可派;act free 步要有执行证据核对(格点探针里偶尔不调工具直接编答案,0 工具时则一律编;
    宏观任务里检索步和修错步零调用是常态,见 dims.tool_use)——检索型步骤把检索调用交给程序、模型只拟检索词和按编号挑选
    (fact check 与 deep research 的 qwen-flash 专属变体即此形态,2026-09-29 完赛),修错步(对长草稿做精确局部编辑)不派本模型;
    要逐字抄原文(专名、标题、引文)的步骤别指望它保真,下游要按原文机械比对。
    生成类步骤(ppt 这种一次写出大块 HTML)能用,前提是每类常见病都有机械核对兜底:examples/ppt-html.md 母本 2026-09-29 补齐外壳叠放、
    翻页脚本、id 存在、未转义小于号、页数等机检后,ppt17、ppt18 两跑接近干净(15.5 万 tokens / 8.3 分钟);只靠教学不配机检的病会反复出现。
