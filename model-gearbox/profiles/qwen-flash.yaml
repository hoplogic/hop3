    #   而是交了"缺信息:无缺信息,可正常执行提取任务"(填错了输出槽)。
    # 真实任务(n=1 定性)里修订意见基本不落实,但失手形态是"该调工具改文件却一次不调、谎报已改"——病在工具使用(见 dims.tool_use),不在读懂意见:
    # hb2 终审定向意见两轮都零工具调用、谎报"修了 N 处",文件一字未动;标准拆解条款 2 语法沙箱报文 4 次点名同一行,4 次提交都没改。
    # G6 自愈回路里简单/普通档按沙箱报文能改过来,复杂档同一报文三轮不改(ast.Expr)——短小明确的报文能改,真实任务里的修订意见基本不落实。
  domain_knowledge: untested        # G7 领域知识充分度:探针未建
  knowledge_acquisition: untested-negative-signals  # G8 渐进知识获取:四环观测口径还没成文,按另三家同一口径定性为"初步负向"——
    # 四环里第一环"察觉自己缺知识"就断了:fact check 核查点检索步零调用 S 6/14、M 17/32、L 32/87,deep research 整次只真搜 6 次,
    # 缺依据时不去查而是直接编网址和数字;还凭自身知识断定"事件是未来日期、无公开报道"(真实检索结果里已有报道)。

act_free:                          # run-act-free-stability 全 30 格 × n=6=180 发,真引擎,思考按引擎内建缺省(本端点缺省关)。曲线账=../probes/act-free-stability/run-qwen_flash-2026-09-26/
  reliability_curve:
    noise_only: { short: {t0: 1.0, t1: 1.0, t3: 1.0, t5: 1.0, t10: 1.0}, mid: {t0: 1.0, t1: 1.0, t3: 1.0, t5: 1.0, t10: 1.0}, long: {t0: 1.0, t1: 1.0, t3: 1.0, t5: 1.0, t10: 1.0}, n: 6 }
    tool_required: { short: {t1: 1.0, t3: 1.0, t5: 1.0, t10: 1.0}, mid: {t1: 0.833, t3: 1.0, t5: 1.0, t10: 1.0}, long: {t1: 1.0, t3: 1.0, t5: 1.0, t10: 0.833}, n: 6 }
    zero_tool_control: { short: 0.0, mid: 0.0, long: 0.0, n: 6 }   # 0 工具×需要工具=设计内必死对照格(没有工具读不了文件)。实测行为=编数字交卷(123/100/-1/200 这类),没有一发如实说"做不到"
  rating: le0-tools                # 机械读数(探针规则:工具数≤N 的格全部≥0.9 才算 leN)。⚠ 这个读数会误导:
    # 两个不达线格 mid:1 与 long:10 各只错 1 发(5/6),而且都不是"工具多了扛不住"——验尸两发现场(hoplog):
    # 模型一次工具都没调,思考后直接交了编的数(5678、123)。失手和工具数无关(1 件和 10 件各一发,3/5 件全过),
    # 是零星的"不读文件就编答案"。对照 27b 同仪器 full-tolerance(需要工具的格全 1.00)。
subtask_free: untested

extract_scaling:                   # G2 单发裸测曲线(run-task-complexity,n=6,max_tokens 32768,思考关)
  # 切块尺寸标定(run-chunk-calibration,XL 语料 40 点答案键,每档 2 发,2026-09-28,产物 ../probes/chunk-calibration/run-qwen_flash-2026-09-28/):
  #   整篇 97.5/85,块 8 行 87.5/97.5,块 16 行 92.5/92.5,块 32 行 95/92.5;块 32 行 3 路并发单份 95/97.5/92.5,并集 100%
  #   ——与 Ling、27b 同一规律:切块抬底,并集收满。40 点以上的提取步按"切块 + 3 路并集"派
  xs_2pts_bare: { pass: '6/6', n: 6 }
