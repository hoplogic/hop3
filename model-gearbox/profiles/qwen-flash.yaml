# qwen-flash 能力档案（字段契约见 ../README.md;判据方法论见 docs/tutorials/D12）
# ⚠ 本档案测的是 qwen-flash × 百炼 /apps/anthropic 端点这个组合。它和 qwen3.8-27b 档案里的
#   /api/v2/apps/claude-code-proxy 是两个不同的端点,数据互不借用。端点协议面实测见 maintainers/模型端点票.md。
# ⚠ 本端点缺省**关**思考。各维度的主读数(档位值与 extract_scaling 的 *_bare 行)量的是思考关档;
#   思考开档(--thinking on,budget=max_tokens/2)2026-09-28 充值后把 G1/G2/G5/G6/P1 全部补量了一遍,读数写在各维度注释的"思考开档"段里。
# 测试时该端点尚未接进真配置(接入须作者同意),探针经临时配置(service_id=qwen_flash)跑,见 todo/plan-flash双端点变速箱测评.md。
model: qwen-flash             # 响应体 model 字段实测值(各族 summary 的 model_from_response 均为 qwen-flash)
provider_ref: qwen_flash      # 参考接入写法见 maintainers/模型端点票.md「接入参考」节;auth 用 x-api-key,密钥变量 DASHSCOPE_API_KEY
endpoint_note: https://dashscope.aliyuncs.com/apps/anthropic;强制调工具(tool_choice)时 stop_reason 报 end_turn 而非 tool_use(引擎按 content 里的 tool_use 块判,不受影响)
context_window: 992059        # 端点实测(run-context-window,2026-09-28):收下 992059 输入 token,再大就 400 拒收("Range of input length should be [1, 1000000]"),名义窗口 100 万。
  # ⚠ 名义窗口够,模型却用不上:输入到约 77 万 token 起,问开头的暗号就答错(77 万/90 万/96 万/99 万四发全错,答的是填充行里的数字);
  #   51 万及以下三发全对。能可靠用上的窗口按 ≤51 万算——长材料步骤按这个数切,不按 100 万。超窗时端点报错拒收(不静默截断)。表=../probes/context-window/endpoint-context-windows.yaml
max_output_tokens: 32768      # 端点硬限:请求超过 32768 直接报 400;请求 32768 时写满后以 max_tokens 截断(run-output-cap,表 ../probes/output-cap/endpoint-output-caps.yaml)
measured: 2026-09-27          # 探针产物目录名里的日期是 UTC 日期,显示为 2026-09-26

dims:
  check_judge: checklist-only      # P1 三层实测(run-judge-granularity,n=6,思考关,产物 ../probes/judge-granularity/run-qwen_flash-2026-09-26/):
    # L2 按清单核验满分——好卷 6/6 判过、坏卷 6/6 判不过、零自相矛盾、漏项定位 6/6。
    # L1 开放式核验 6 发全判不过,主意见恒是同一条(P5 缺"四杯不超过 400 毫克"前提,与 deepseek 当年抓的同一处),
    #   但次要意见每轮不同,且有两轮指错了分类——跨轮框架不完全一致,不到 open-ok。
    # L3 单点核验反常:好卷臂 6/6 对,坏卷臂(清单只覆盖了一行两个断言中的一个)6 发全答"covered: yes",0/6。
    #   探针脚本对 L3 未全对给的机械建议是"unusable 候选,复核原件后定"。复核结论(agent 判定):不定 unusable——
    #   同一处漏项在 L2 清单形态下 6/6 抓出,说明判断能力在场;L3 题面要求只回两行,思考关时模型没有任何推理空间,
    #   一个字答 yes 就交卷。所以定 checklist-only,并且**单点小题形态对本模型(思考关)不可靠**,
    #   这与"三档由易到难"的阶梯假设相反(27b/deepseek/Ling 三家 L3 都是满分),是本档案最需要知道的一格。
    # 思考开档(2026-09-28,产物 ../probes/judge-granularity/run-qwen_flash-thinking-2026-09-28/):
    #   L3 12/12 全对(坏卷臂 6 发全答 no)——关思考的单点反常开思考即消失,坐实病因是"关思考时没有推理空间"。
    #   L2 仍全满(好 6/6 判过、坏 6/6 判不过、零矛盾、定位 6/6)。
    #   L1 六轮全判不过,六轮都只提同一条意见(P5 前提②"四杯以内的标准咖啡含咖啡因不超过 400 毫克"文档没写),次要意见消失,零相反指令——
    #   按判档规则(L1 零自反不排除 open-ok)与 deepseek 定 open-ok 的同一口径(六轮同一意见同方向,判严不判摇),开思考档定 open-ok。
    #   瑕疵一条:6 轮里 2 轮把这条意见说成"应补列为 fact",但文档并没有写这句话,照办等于补一个文档里没有的事实;另 4 轮说的是"前提未在文档中陈述",是对的。
    # 派活口径:关思考时把关步给清单式判据,不要拆成只许回 yes/no 的单点小题;把关步开思考则单点小题与开放式核验都可用。
  reasoning_complexity: mid                 # 双任务阶梯(run-reasoning-complexity,思考关,90% 线 20 发确认):
    # 直接推理(乘法)最大 N=7(N7 确认 19/20;N8 确认 11/20 不达线);
    # 迭代推理(除法 2N÷N 取 2N+1 位有效数字)最大 N=5(N5 确认 19/20;N6 确认 12/20 不达线)。
    # 对照:27b 乘 3/除 2、Ling 思考开档乘 6/除 6、deepseek 乘≥12/除≥8——qwen-flash 思考关档已高于 27b,与 Ling 开档同量级。
    # 思考开档(--thinking on,budget=max_tokens/2,2026-09-28,产物 ../probes/reasoning-complexity/run-qwen_flash-thinking-2026-09-28/):
    #   乘法爬梯 N2—N6 全 5/5、N7 4/5;N7 确认 14/20(70%,不达线)。N6 确认第一次只跑成 15 发(对 14 发,其余被账户欠费拒收),
    #   充值后补跑(产物 ../probes/reasoning-complexity/run-qwen_flash-thinking-topup-2026-09-28/):N5、N6 爬梯各 5/5,N6 确认 20/20——
    #   开思考乘法最大 N=6(确认),不比关思考的 7 高。
    #   除法(产物 ../probes/reasoning-complexity/run-qwen_flash-div-thinking-2026-09-28/):N2 爬梯 5/5;N3 爬梯 4/5、确认 19/20;N4 爬梯 4/5、确认 15/20 不达线——
    #   按探针判分规则开思考除法最大 N=3,低于关思考的 5。
    #   N4 确认的 5 发失败里只有 2 发是数算错(第 10 发 3183.45603 对 3183.45600;第 11 发 6430.62970 对 6430.62969,末位进位错),
    #   另 3 发(第 4、15、17 发)商完全正确,只是最后一行没写题面要求的"答案: <商>"前缀、光写了一个数,探针按"没有答案行"判错。
    #   agent 判定:官方读数照探针规则记 3,不手工改判——题面明确要求这个前缀,关思考那一跑也按同一规则判;
    #   即使把这 3 发算对,N4 也只到 18/20、N5 没跑,开思考除法至多读作"≥4",仍不高于关思考的 5。
    #   开思考额外暴露一个格式毛病:N3、N4 确认 40 发里有 5 发丢了答案行前缀(关思考除法一跑 104 发里 2 发,写成"答:"而不是"答案:")。
    #   结论:重推理步不开思考——乘除两项开思考都不比关思考强,还更容易丢交付格式。
  task_complexity: mid                 # G2 单发裸提取曲线(run-task-complexity,n=6,max_tokens 32768):见下方 extract_scaling。
    # 18 个要点以内全过,40 点 2/6,80 点 0/6——坍塌点在 18~40 点之间(与 27b 裸测曲线同一位置,deepseek 在测程 80 点内无坍塌)。
    # 80 点档每发写出约 18KB,离 32768 输出上限很远,失分是真漏点(每发漏 3~23 点)和类型标错,不是截断。
    # 只有裸单发曲线,引擎内真实任务没跑过——真实任务下(全量供给+修订轮)可能更差,定档先按裸曲线记。
    # 思考开档(2026-09-28,产物 ../probes/extract-scaling/run-qwen_flash-thinking-2026-09-28/):XS 6/6、S 6/6、M 0/6、L 0/6、XL 0/6、XXL 3/6。
    #   通过率曲线不单调,要看覆盖数才读得懂:M 每发 8/9、L 每发 15—16/18、XL 每发 38—39/40、XXL 76—80/80(3 发满分)。
    #   M、L 两档 12 发全漏同一点:文档里"孕妇和心脏病患者也大可放心"被并进了前一句"四杯以内对所有人都安全"(每发只写一条"对所有人安全",
    #   原文的孕妇/心脏病字样一次都没出现)——开思考后模型倾向把同一段的推论收成一条,关思考时 6/6 都拆开了;
    #   L 档另有 4 发漏"绿茶含量约为咖啡三分之一"(并进别的点或漏掉)与 4 发把"绿茶与心血管风险降低相关"只写进前提没单列。
    #   读法:开思考只在最大一档有收益——XXL 关思考每发覆盖 57—77/80、开思考 76—80/80(3 发满分);
    #   XL 关思考 36—40/40(2 发满分)、开思考 38—39/40(一发都没满分),持平偏差;小档则多出"并点"习惯;
    #   按 18 点以内派活的口径下,开思考反而不如关思考(M、L 关思考 6/6)。提取步不开思考。
  planning_decompose: weak         # G3 分解与规划:没有专用探针(双考场方案待实装),与另三家同一取证口径——看 hb2 构建卷(incident 语料,n=1,2026-09-28):
    # 修检额度烧尽后整树重建,重建产物空心;最终产物"模式为空"的分支只有一个问模式的步骤、没有步骤产出交付物,
    # SEV 分级缺判定标准,new 分支不写首次通报。与 Ling、27b 同档(两家同语料也是空心或带缺陷收场)。
  tool_use: mid                    # 格点探针(见下方 act_free 段)与宏观任务实跑(2026-09-27/28,宏观任务验收与成绩 flash 矩阵)两个来源。
    # 格点探针:需要工具的非零工具格共 72 发,70 发一发用对;失手的 2 发都是一次工具都没调、直接编了个数交卷。
    # 不需要工具的 15 格(含长供给×10 件工具满配)90 发全过,零乱调工具。
    # 宏观任务实跑坐实了"声明了工具却零调用、直接编产出"是本模型的稳定习惯,不是零星失手:
    #   fact check 核查点的检索步零调用 S 档 6/14、M 档 17/32、L 档 32/87,交出编造的网址与摘要
    #   (例 https://www.sse.com.cn/announcement/2025/05/12345.html、tech.example.com);deep research 整次只真搜 6 次,
    #   多步交 example.com 假结果;hb2 构建的定向修错步两轮都零工具调用,回报"修了 4 处""修了 3 处",文件一字未动。
    #   对照 glm-5.3-flash 同格每个核查点都真搜(2—10 次)。
    #   治法(作者决策 todo/decision/20260928-检索步零调用编造证据的治法.md,落地 59dd758b):检索步要求交出查过的
    #   网址与页面标题并明说会核验,紧跟机械核验步按标题补搜比对网址。复测(fc S 档):检索步仍有 6/12 零调用——
    #   明说会核验并没有改掉习惯,但编造的 6 条证据全被核验剔除并在报告里点名。
    # 抄写保真缺陷:把"燧原"稳定错写成"燕原"(原文只有"燧原",两次 fc S 档都出现),错字进了核查说法与证据标题,
    #   报告据此虚构出"名称混淆";核验步按错字标题补搜搜不回真网址,误剔了 1 条真证据。
    # 零调用的原因(2026-09-29 直连 A/B,只看检索步首个回复有没有调工具,温度 0 开思考):零调用回复的思考里几乎全部在说
    #   "这是模拟/我没法真的检索",模型怀疑工具是假的。改引擎工具纪律句不管用(改写 16/36、整句删掉 7/36,原句 15/36);
    #   在检索步正文写一句"web_search 是真实可用的工具,调用后引擎会把真实检索结果返回给你,不是模拟。先调用它,拿到结果再写产出"
    #   明显有效(15/36→28/36;按引擎实发工具描述另测 18/36→26/36),已写进 examples/hop-fact-check.md 两处检索步。
    #   引擎实发的 web_search 描述是空的(注册文件的 notes 没进清单,todo/0122),补上描述也能抬首发调用率(53/90→67/90)。
    #   强制首发调工具(tool_choice any)在本端点开思考时被拒(HTTP 400),这条路不通。
    #   核验不通过就打回检索步重做(试验版规约,没进库):首轮零调用的点被打回后大都真搜了,全程零调用降到 1 个点,
    #   但一次 run 费用翻倍(48—62 万 tokens,原 30.6 万),而且"燕原"错字照旧,多数点仍落无依据,没进库。
    #   27b 变体规约(examples/hop-fact-check.qwen3.8-27b.md)换给本模型跑 fc S 更差(34 个检索步 25 个零调用,99 万 tokens),不采用。
    # 真正治住的路(2026-09-29 专属变体规约):不让模型自己调检索工具——模型只拟检索词,程序调 web_search 并把结果编号呈上,
    #   模型按编号挑依据,网址由程序照抄。examples/hop-fact-check.qwen-flash.md 三档完赛(S 14.6 万 / M 55.4 万 / L 125 万 tokens),
    #   examples/hop-deep-research/hop-deep-research.qwen-flash.md 完赛(14.7 万 tokens,9 条论断网址全真)。
    #   结论:检索型任务派给本模型时,检索调用归程序;"模型自己决定要不要调工具"的形态不派。
    # 精确局部编辑是绕不开的短板(hb2 专属变体 spec.qwen-flash.md,vhb2c 跑次,约 51 万 tokens 停):修错步的 edit_file
    #   要替换的原文凭记忆写、盘上没有那一行,反复"未找到匹配";教学写明"逐字复制盘面原文"、引擎零匹配时附最接近三行原文,都没救回;
    #   终审四处定向意见只落实一处(还带出笔误),缺陷 1→6 条。修错步不派本模型。
  structured_delivery: mid         # G5 双指标(run-structured-delivery,n=6):六档里五档 6/6(含对象列表、三层嵌套、yaml 结构值);
    # "六个字段混合类型、含多行文本"那档 2/6——失败的 4 发把一个对象写成"每个字段一行的列表"(- task_name: … 这种形态),
    # 解析出来是列表不是对象。这是真形态错,引擎的围栏容忍救不了;零围栏病。容错后=与裸皮同档。
    # 思考开档(2026-09-28,产物 ../probes/structured-delivery/run-qwen_flash-thinking-2026-09-28/):T1—T6 = 6/6·5/6·6/6·6/6·6/6·6/6。
    #   T2 从 2/6 升到 5/6;唯一失败那发是多行文本 note 的续行没缩进(note: | 后面各行顶格写),整体解析不成对象。开思考基本治好了 T2 的形态错。
  code_generation: {python: weak, sql: mid}   # G6 代码生成(run-code-generation,Python 与 SQL 各三档,n=6,隐藏测试判分,自愈回路最多 2 轮):
    # Python(规范条款→校验脚本,引擎同款语法沙箱内执行):一次写对 简单/普通/复杂 全是 0/6——18 发第一轮全部被语法沙箱拒。
