# act_free 工具面稳定性阶梯——测试矩阵定义（探针族契约,消费方=run-probes 跑批与人工跑批）
# 测什么:act free 步在{供给长度 × 工具面大小 × 任务是否真需要工具}网格上的可靠性衰减曲线。
# 为什么是曲线不是档位:作者定 2026-09-18"从可靠到不可靠,把数值测出来"——档位从曲线机械读出,不拍。

matrix:
  supply_length:        # 供给面长度(格点任务模板按档备,数字=正文字符量级)
    - short   # ~1K —— 直连探针级
    - mid     # ~4K —— 常规步骤级
    - long    # ~8K —— 引擎重供给步级(Qwen 七轮实验的实测区)
  tool_count: [0, 1, 3, 5, 10]    # 0=纯推理对照;10=引擎 basic 族满配
  task_kind:
    - noise_only      # 任务不需要工具(输入全实值)——测抗噪半边:会不会乱摸(=D12 维度 P2)
    - tool_required   # 任务必须用工具才答得出(如"读文件 X 统计行数")——测正用半边:用不用得好(=D12 维度 G5 inline 工具使用 loop)
                      # 两半合起来才是 act_free 完整可靠性;只测抗噪半边=Qwen 首轮教训
                      # (incident 撞墙 137 次分不清"不该用时乱用"还是"该用时用不好")

per_cell:
  n_min: 6            # 每格至少 6 试——单批 n=3 实测过批间反转(Qwen 2 工具档 2/3 偏→复测 0/3)
  metrics:
    - completion_rate   # 完成率:noise_only=零调用直接交对;tool_required=调对工具且答案对
    - round_efficiency  # 工具轮效率=实际轮数/任务最小轮数(1.0 完美;>3 判打转)
    - failure_mode      # 失败形态归类:走偏摸环境|同签名复读|撞 20 轮墙|交错答案|截断
  verdict_check: mechanical   # 格点任务的答案必须机械可判(数值比较/行数统计类),不引判官

output:
  shape: profiles 档案 act_free.reliability_curve 同构 yaml(每格 {rate, n})
  rating_rules: |
    从曲线机械读档(不人工拍):
    - full-tolerance: 全格 rate ≥ 0.9
    - leN-tools: 工具数 ≤N 的全部格 rate ≥ 0.9 且 N+1 档跌破
    - *-noise-side-only: tool_required 半边空缺时 rating 恒带此尾标(半边数据只许判半边)
    - untested-curve: 曲线为空
