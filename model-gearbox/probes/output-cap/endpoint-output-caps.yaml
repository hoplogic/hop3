    response_model: qwen3.8-27b
    measured: '2026-09-26'
    count_to: 15000
    requested_max_tokens: 65536
    verdict: endpoint_cap
    endpoint_output_cap: 4096
    note: 2 发都在 4096 被掐断(请求 65536),端点自带上限,忽略请求 max_tokens
    attempts:
      - stop_reason: max_tokens
        output_tokens: 4096
        last_line: '104'
        seconds: 27
      - stop_reason: max_tokens
        output_tokens: 4096
        last_line: '104'
