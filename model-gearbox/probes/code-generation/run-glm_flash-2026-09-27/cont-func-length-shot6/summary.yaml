service: glm_flash
model_from_response:
  - glm-5.3-flash
date: '2026-09-27'
维度: G6 代码生成——Python 档(规范条款→校验脚本,Python 语法沙箱内执行,判分=隐藏测试文件退出码全对)与 SQL 档(取数需求→SQLite 查询,判分=隐藏测试数据上结果集全等);每题 n=1,自愈回路最多 2 轮只反馈公开样例与沙箱/执行报文
指标说明: 一次写对=第 1 轮的解在全部隐藏测试上全对(Python 退出码全对,SQL 结果集全等);首轮崩溃在 SQL 题=查询执行报错;自愈后通过=回路结束时最后一版脚本全对;公开过隐藏挂=模型看得见的样例都过了但隐藏测试有挂(自验通过的校验在真实文件上失效)
tasks:
  func-length:
    语言: python
    档: 普通
    一次写对: 1/1
    自愈后通过: 1/1
    首轮沙箱拒绝: 0/1
    首轮截断: 0/1
    首轮崩溃: 0/1
    公开过隐藏挂: 0/1
    隐藏测试文件数: 8
    shots:
      - i: 1
        first_try_pass: true
        first_try_outcome: ran
        first_try_crashed: false
        final_pass: true
        rounds_used: 1
        public_pass_hidden_fail: false
        final_hidden_failed: []
