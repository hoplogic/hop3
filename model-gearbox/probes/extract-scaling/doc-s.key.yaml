# doc-s 答案键——判分对键机械比对,不采信 run 内自评(见 README 判据独立性)
expected_total: 4
required:
  - ref: 消费量
    match: ['30 亿']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 全球每天消费约 30 亿杯咖啡
  - ref: 半衰期
    match: ['半衰期', '5 小时']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 咖啡因半衰期约 5 小时
  - ref: 影响睡眠
    match: ['睡眠']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 下午晚些时候摄入咖啡因会影响夜间睡眠质量
    premises_must_cite: [半衰期约 5 小时]
  - ref: 四杯安全
    match: ['四杯', '安全']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 每天四杯以内标准咖啡对多数人安全
    premises_must_cite: [FDA 每日上限 400 毫克]
notes: 隐含前提"一杯标准咖啡约 100 毫克咖啡因"若被模型补出属加分观察项,不作必要件。
