# doc-m 答案键——判分对键机械比对,不采信 run 内自评(见 README 判据独立性)
# 本档=hop-fact-check 原样本(A2 实测死点)。复合断言在场:L12-L13 一句混三个独立 claim,必须拆开。
expected_total: 9
required:
  - ref: 消费量
    match: ['1.77 亿']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 2023 年全球咖啡消费量约 1.77 亿袋(每袋 60 公斤)
  - ref: 欧盟市场
    match: ['欧盟']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 欧盟是最大的咖啡消费市场
  - ref: 半衰期
    match: ['半衰期', '5 小时']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 咖啡因半衰期在健康成人体内约 5 小时
  - ref: FDA 上限
    match: ['FDA', '400']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: FDA 建议健康成人每日咖啡因不超过 400 毫克
  - ref: 四五杯换算
    match: ['400', '杯']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact|inference   # 两可:原文直陈"大约相当于"——读作事实换算或推演皆合理,裁量两可不作判分依据
    claim_gist: 400 毫克大约相当于四到五杯咖啡
    premises_if_inference: [FDA 上限 400 毫克]   # 前提要求随 type 分道:按 inference 提取才查前提,按 fact 提取天然无前提不扣
  - ref: IARC 热饮
    match: ['2A']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条('2A'单词已唯一定位;原锚 65+2A 双词要求单点同含——模型按'宁细勿漏'把整句拆两点即被误判,锚词与拆分指令自相矛盾后放宽)
    type: fact
    claim_gist: 2015 年 IARC 将高于 65°C 的"非常热的饮品"列为 2A 类致癌物
  - ref: 移出清单
    match: ['2016', '移出|移除']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 咖啡本身于 2016 年被移出致癌物清单
  # ── 复合断言拆分区(L12-L13 一句话,必须拆成独立点;合并成一点=不过——A2 六轮打回全在此) ──
  - ref: 对所有人安全
    match: ['四杯', '安全']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 每天不超过四杯,喝咖啡对所有人都安全甚至有益
    premises_must_cite: [FDA 上限与杯数换算, IARC 移出清单]
  - ref: 特殊人群放心
    match: ['孕妇|心脏病']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 孕妇和心脏病患者也可放心饮用咖啡
    premises_must_cite: [对所有人安全的泛化]
notes: >-
  "对所有人安全"与"孕妇/心脏病患者放心"是两个独立可核查断言(后者是前者最脆弱的特例,
  核查路径不同),模型把 L12-L13 收成一点即漏提。允许模型把"IARC 为咖啡正名"再单拆一点,不扣分。
