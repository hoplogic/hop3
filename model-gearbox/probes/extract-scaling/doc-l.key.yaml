# doc-l 答案键——判分对键机械比对,不采信 run 内自评(见 README 判据独立性)
# 本档=doc-m 全文 + 补充材料段(跨段对照断言在场:IARC 2016 一事两段各说一遍,分类还不同——2A vs 2B)
expected_total: 18
required:
  # ── 与 doc-m 同的 9 点(键同 doc-m.key.yaml,此处只列 ref) ──
  - ref: 消费量
    match: ['1.77 亿']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
  - ref: 欧盟市场
    match: ['欧盟']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
  - ref: 半衰期
    match: ['半衰期', '5 小时']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
  - ref: FDA 上限
    match: ['FDA', '400']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
  - ref: 四五杯换算
    match: ['400', '杯']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact|inference   # 两可(同 doc-m 键)
  - ref: IARC 热饮
    match: ['2A']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条('2A'单词已唯一定位;原锚 65+2A 双词要求单点同含——模型按'宁细勿漏'把整句拆两点即被误判,锚词与拆分指令自相矛盾后放宽)
    type: fact
  - ref: 移出清单
    match: ['2016', '移出|移除']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
  - ref: 对所有人安全
    match: ['四杯', '安全']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
  - ref: 特殊人群放心
    match: ['孕妇|心脏病']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
  # ── 补充材料段 9 点 ──
  - ref: 绿茶含量
    match: ['绿茶', '三分之一']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 绿茶咖啡因含量约为同量咖啡的三分之一
  - ref: IARC-2B
    match: ['2B']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: IARC 2016 年将咖啡从 2B 类致癌物清单移除
    cross_ref_note: 与正文"移出清单"点指同一事件但清单类别表述不同(正文未提类别,此处称 2B)——模型把两处并成一点可接受,但须保留两处 line_ref;丢掉任一处出处=漏
  - ref: 担忧缺据
    match: ['担忧|证据']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 此前"咖啡可能致癌"的公众担忧缺乏当前证据支持
    premises_must_cite: [IARC 2016 移除]
  - ref: 英国茶量
    match: ['英国', '1.9']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 英国人均年茶叶消费量约 1.9 公斤
  - ref: 绿茶心血管
    match: ['心血管']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact|inference   # 两可:"有研究表明 X 相关"读作研究结论转述(fact)或相关性推演皆合理
    claim_gist: 有研究表明每天 3-4 杯绿茶与心血管疾病风险降低相关
  - ref: 茶更稳妥
    match: ['稳妥|营养学家']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 一些营养学家认为茶是比咖啡更稳妥的日常饮品选择
    premises_must_cite: [绿茶心血管研究]
  - ref: 能量饮料含量
    match: ['80', '毫克']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 红牛等能量饮料单罐咖啡因约 80 毫克,与一杯浓缩咖啡相当
  - ref: 依赖加剧
    match: ['依赖']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 未来年轻人群咖啡因依赖问题可能加剧
    premises_must_cite: [青少年能量饮料摄入比例逐年上升]
  - ref: 脱因残留
    match: ['脱因', '2-3%|2%|3%']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 脱因咖啡仍含原有咖啡因的 2-3%
notes: >-
  "青少年摄入比例上升"作为"依赖加剧"的前提句,模型单独立点或收进 premises 皆可(单独立点则 total 19,不扣分)。
  跨段对照(IARC-2B vs 正文移出清单)是本档特有考点:测模型是否发现同一事件两处表述并保留双出处。
