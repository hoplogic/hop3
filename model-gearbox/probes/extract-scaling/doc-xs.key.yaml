# doc-xs 答案键——探针判分对此键机械比对,不采信 run 内自评(判据独立性,见 README)
# 比对口径: required 逐条必须有对应点(type 与指向语句都对上才算);允许模型多提不扣分,漏提/错分类即不过
expected_total: 2
required:
  - ref: 半衰期
    match: ['半衰期', '5 小时']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: fact
    claim_gist: 咖啡因半衰期约 5 小时
  - ref: 睡前残留
    match: ['残留']   # 机械判分锚:claim 含全部词(|=任一)且 type 相符=覆盖本条
    type: inference
    claim_gist: 下午 3 点后喝咖啡睡前体内仍残留相当比例咖啡因
    premises_must_cite: [半衰期约 5 小时]   # 推演点必须把这条前提写全(只写"L1"编号不算)
